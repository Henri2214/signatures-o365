name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -c "import pymsalruntime; print('pymsalruntime OK')"
      - run: python -m pytest -q tests
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pymsalruntime --name SignaturesO365 sig_o365.py
      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\SignaturesO365.exe -Algorithm SHA256).Hash
          "$h  SignaturesO365.exe" | Out-File -Encoding ascii dist\SignaturesO365.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SignaturesO365.exe
            dist/SignaturesO365.exe.sha256
          generate_release_notes: true
